name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils ninja-build pkg-config
          
      - name: Install dependencies
        run: |
          pip install flet requests
          
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | flet build apk
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VodafoneApp-APK
          path: build/apk/**/*.apk
