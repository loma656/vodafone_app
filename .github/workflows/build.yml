name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils ninja-build pkg-config
          
      - name: Install dependencies
        run: |
          pip install flet requests
          
      # الخطوة السحرية: تشغيل flet build لمرة أولى ليقوم بتحميل فلاتر، ثم قبول التراخيص فوراً وبعدها بناء التطبيق
      - name: Build APK
        run: |
          echo "y" | flet build apk || true
          yes | /home/runner/.flet/cache/flutter/bin/flutter doctor --android-licenses || true
          echo "y" | flet build apk
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VodafoneApp-APK
          path: build/apk/**/*.apk
